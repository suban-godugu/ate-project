name: Email Notification on Push
on:
  push:
    branches: [main]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "${{ github.actor }} modified files in ${{ github.repository }}"
          to: contact@verilumen.ai,lavanya@verilumen.ai,suban@verilumen.ai
          from: verilumen.noreply@gmail.com
          body: |
            Changed by : ${{ github.actor }}
            Repository : ${{ github.repository }}
            View change: ${{ github.event.head_commit.url }}